<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose light or dark mode for Lian Cataytay's portfolio.">
    <title>Light / Dark | Lian Cataytay</title>
    <link rel="icon" href="assets/lian-cataytay-lc-tech-logo.png" type="image/png">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/script.js" defer></script>
  </head>
  <body data-page="theme">
    <main class="page-shell">
      <header class="site-header reveal">
        <a class="avatar" href="index.html" aria-label="Lian Cataytay home">
          <img src="assets/lian-cataytay-lc-tech-logo.png" alt="LC Tech logo">
        </a>
        <div class="identity">
          <h1 class="identity-name">Lian Cataytay</h1>
          <p class="identity-role">Data Analyst &middot; Economist</p>
        </div>
        <a class="icon-link" href="https://github.com/liancataytayjk-coder" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M9 19c-4.3 1.4-4.3-2.2-6-2.7m12 5.1v-3.7c0-1 .1-1.4-.5-2 2.7-.3 5.5-1.3 5.5-6A4.6 4.6 0 0 0 18.7 6c.1-.3.6-1.7-.2-3.6 0 0-1.1-.3-3.6 1.4a12.4 12.4 0 0 0-6.6 0C5.8 2.1 4.7 2.4 4.7 2.4A4.8 4.8 0 0 0 4.5 6 4.6 4.6 0 0 0 3.2 9.7c0 4.7 2.8 5.7 5.5 6-.6.6-.7 1.2-.7 2v3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </header>

      <section class="page-section reveal" aria-labelledby="theme-title">
        <h2 class="section-title" id="theme-title">Light / Dark</h2>
        <p>Choose the reading mode that feels best. The setting is saved on this browser.</p>
        <div class="theme-list" aria-label="Theme choices">
          <button class="theme-choice" type="button" data-theme-choice="light">Light mode <span>Clean white notebook feel</span></button>
          <button class="theme-choice" type="button" data-theme-choice="dark">Dark mode <span>Soft low-light reading</span></button>
        </div>
      </section>
    </main>

    <nav class="dock" aria-label="Primary navigation"></nav>
  </body>
</html>
