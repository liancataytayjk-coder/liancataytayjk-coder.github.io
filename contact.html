<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact Lian Cataytay for data analysis, business intelligence, research, and AI-assisted analytics work.">
    <title>Contact | Lian Cataytay</title>
    <link rel="icon" href="assets/lian-cataytay-lc-tech-logo.png" type="image/png">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/script.js" defer></script>
  </head>
  <body data-page="contact">
    <main class="page-shell">
      <header class="site-header reveal">
        <a class="avatar" href="index.html" aria-label="Lian Cataytay home">
          <img src="assets/lian-cataytay-lc-tech-logo.png" alt="LC Tech logo">
        </a>
        <div class="identity">
          <h1 class="identity-name">Lian Cataytay</h1>
          <p class="identity-role">Data Analyst &amp; Economist</p>
        </div>
        <div class="header-actions">
          <a class="icon-link" href="https://github.com/liancataytayjk-coder" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M9 19c-4.3 1.4-4.3-2.2-6-2.7m12 5.1v-3.7c0-1 .1-1.4-.5-2 2.7-.3 5.5-1.3 5.5-6A4.6 4.6 0 0 0 18.7 6c.1-.3.6-1.7-.2-3.6 0 0-1.1-.3-3.6 1.4a12.4 12.4 0 0 0-6.6 0C5.8 2.1 4.7 2.4 4.7 2.4A4.8 4.8 0 0 0 4.5 6 4.6 4.6 0 0 0 3.2 9.7c0 4.7 2.8 5.7 5.5 6-.6.6-.7 1.2-.7 2v3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </header>

      <section class="contact-panel reveal" aria-labelledby="contact-title">
        <h2 class="section-title" id="contact-title">Let&rsquo;s work together.</h2>
        <p>I&rsquo;m always open to chat.<br>Let&rsquo;s talk about what we can build together.</p>
        <a class="contact-email" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=liancataytayjk%40gmail.com" target="_blank" rel="noopener noreferrer">liancataytayjk@gmail.com</a>
        <div class="contact-pills" aria-label="Social links">
          <a href="https://www.linkedin.com/in/liancataytay/" target="_blank" rel="noopener noreferrer">
            <span aria-hidden="true">in</span>
            LinkedIn
          </a>
          <a href="https://github.com/liancataytayjk-coder" target="_blank" rel="noopener noreferrer">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M9 19c-4.3 1.4-4.3-2.2-6-2.7m12 5.1v-3.7c0-1 .1-1.4-.5-2 2.7-.3 5.5-1.3 5.5-6A4.6 4.6 0 0 0 18.7 6c.1-.3.6-1.7-.2-3.6 0 0-1.1-.3-3.6 1.4a12.4 12.4 0 0 0-6.6 0C5.8 2.1 4.7 2.4 4.7 2.4A4.8 4.8 0 0 0 4.5 6 4.6 4.6 0 0 0 3.2 9.7c0 4.7 2.8 5.7 5.5 6-.6.6-.7 1.2-.7 2v3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            GitHub
          </a>
        </div>

        <form class="message-card" action="https://api.web3forms.com/submit" method="POST" data-contact-form>
          <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
          <input type="hidden" name="subject" value="New portfolio inquiry for Lian Cataytay">
          <input type="hidden" name="from_name" value="Lian Cataytay Portfolio">
          <input type="checkbox" name="botcheck" class="visually-hidden" tabindex="-1" autocomplete="off">
          <div class="message-head">
            <h3>Send me a message</h3>
          </div>
          <div class="field-grid">
            <label>
              Name
              <input type="text" name="name" placeholder="Juan Dela Cruz" autocomplete="name">
            </label>
            <label>
              Email
              <input type="email" name="email" placeholder="juandelacruz@example.com" autocomplete="email">
            </label>
          </div>
          <label>
            Message
            <textarea name="message" rows="6" placeholder="Hi Lian, I'd love to chat about..."></textarea>
          </label>
          <div class="message-footer">
            <button type="submit">
              <span aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="m4 12.2 15-7.1-4.8 14.3-3.1-5.8L4 12.2Zm7.1 1.4 3.4-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              Send message &rarr;
            </button>
          </div>
          <p class="form-status" data-form-status aria-live="polite"></p>
        </form>
      </section>
    </main>

    <nav class="dock" aria-label="Primary navigation"></nav>
  </body>
</html>
