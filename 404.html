<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <base href="/">
    <title>Page not found | Lian Cataytay</title>
    <link rel="icon" href="assets/favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <script>
      (function () {
        var theme = new URLSearchParams(window.location.search).get("theme");
        try {
          theme = theme || localStorage.getItem("lian-portfolio-theme");
        } catch (error) {}
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/script.js" defer></script>
  </head>
  <body data-page="404">
    <main class="page-shell">
      <section class="page-section reveal" aria-labelledby="not-found-title">
        <h1 class="section-title" id="not-found-title">Page not found</h1>
        <p>The page you&rsquo;re looking for doesn&rsquo;t exist or has moved.</p>
        <div class="home-cta">
          <a class="text-link" href="index.html">Go home &rarr;</a>
          <a class="text-link" href="projects.html">Browse projects &rarr;</a>
        </div>
      </section>
    </main>

    <nav class="dock" aria-label="Primary navigation"></nav>
  </body>
</html>
